name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ntu
      - run: npm run check
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ntu-runner/requirements.txt
      - run: pip install -r services/ntu-runner/requirements.txt
      - run: python -m unittest discover -s services/ntu-runner -v
      - run: python -m unittest discover -s services/ntu-browser -v
